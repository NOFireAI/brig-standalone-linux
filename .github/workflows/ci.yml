# Lint the installer and prove the bundle still builds.
#
# The install itself is not exercised here. It needs root, device-mapper and a
# KVM-capable host, so it runs on the Linux testbed rather than on a hosted
# runner.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check POSIX syntax
        run: |
          set -eu
          sh -n install.sh
          sh -n scripts/build-bundle.sh scripts/fetch-hvi.sh scripts/check-assets.sh
          # The wrappers and uninstaller are generated into the tarball by
          # build-bundle.sh, so lint the text it will write rather than waiting
          # to find out on a host.
          awk '/<<.UNEOF.$/ {f=1; next} /^UNEOF$/ {f=0} f' scripts/build-bundle.sh > /tmp/brig-uninstall.sh
          head -1 /tmp/brig-uninstall.sh | grep -q '^#!/bin/sh$' \
            || { echo "extracting the uninstaller went wrong"; exit 1; }
          sh -n /tmp/brig-uninstall.sh
          # The rootless setup is written in two halves, a header carrying the
          # baked layout and a body. Reassemble it with a stub header so the
          # body is linted the same way.
          printf '#!/bin/sh\nset -eu\nPREFIX=/x\nNAMESPACE=x\nSNAPSHOTTER=x\nCNI_DIR=/x\nETC_DIR=/x\n' \
            > /tmp/brig-rootless-setup.sh
          awk '/<<.SETUPBODY.$/ {f=1; next} /^SETUPBODY$/ {f=0} f' scripts/build-bundle.sh \
            >> /tmp/brig-rootless-setup.sh
          grep -q 'brig-containerd.service' /tmp/brig-rootless-setup.sh \
            || { echo "extracting the rootless setup went wrong"; exit 1; }
          sh -n /tmp/brig-rootless-setup.sh
          # brig-ctl is written the same way and now carries the prefix guard
          # and the rootless-bundle check, so it is linted too.
          printf '#!/bin/sh\nset -eu\nPREFIX=/x\nCONTAINERD_ADDRESS=x\nCONTAINERD_NAMESPACE=x\nCONTAINERD_SNAPSHOTTER=x\nNERDCTL_TOML=x\nCNI_PATH=x\nSERVICE_NAME=x\nBRIG_ENV=/x\nROOTLESS=false\n' \
            > /tmp/brig-ctl
          awk '/<<.CTLBODY.$/ {f=1; next} /^CTLBODY$/ {f=0} f' scripts/build-bundle.sh >> /tmp/brig-ctl
          grep -q 'brig-ctl <command>' /tmp/brig-ctl \
            || { echo "extracting brig-ctl went wrong"; exit 1; }
          sh -n /tmp/brig-ctl

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh install.sh scripts/build-bundle.sh scripts/fetch-hvi.sh scripts/check-assets.sh /tmp/brig-uninstall.sh \
            /tmp/brig-rootless-setup.sh /tmp/brig-ctl tests/*.sh

      - name: Script tests
        # The tests run the generated scripts and install.sh against stubs, as
        # a normal user. The rootless setup refuses a user without a subuid
        # range, so the runner gets one.
        run: |
          set -eu
          grep -q "^$(id -un):" /etc/subuid \
            || sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          for t in tests/*.sh; do
            echo "--- $t"
            sh "$t"
          done

  # Build the real bundle on each arch's native runner: urunc from source (never
  # a released urunc), the guest kernel and initrd pulled from hull-assets, the
  # configs generated, everything packed. Native, so no qemu. A smoke test of the
  # whole build path -- not a reproducibility gate, since a source-built urunc is
  # not byte-for-byte identical across builds.
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            rootless: plain
            flag: ''
          - arch: amd64
            runner: ubuntu-24.04
            rootless: rootless
            flag: '--rootless'
          - arch: arm64
            runner: ubuntu-24.04-arm
            rootless: plain
            flag: ''
          - arch: arm64
            runner: ubuntu-24.04-arm
            rootless: rootless
            flag: '--rootless'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build a generic-boot bundle (${{ matrix.arch }}, ${{ matrix.rootless }})
        env:
          SOURCE_DATE_EPOCH: '0'
        run: |
          set -eu
          scripts/build-bundle.sh --arch "${{ matrix.arch }}" --version ci \
            --variant generic-boot ${{ matrix.flag }} --out dist

      # The published record must be the one in the tree, and it must match the
      # kernel and initrd the tree carries. pins.env names the hull-assets
      # bundle both came from by digest, and both must be that bundle's bytes.
      - name: Check the boot-asset digests
        run: |
          set -eu
          r="$(ls dist/*.boot-assets.sha256)"
          d="$(mktemp -d)"
          tar -xzf "$(ls dist/*.tar.gz)" -C "$d"
          g="$(echo "$d"/*/share/guest)"
          cmp "$r" "$g/SHA256SUMS"
          (cd "$g" && sha256sum -c SHA256SUMS)
          awk '{print $2}' "$g/SHA256SUMS" | LC_ALL=C sort | tr '\n' ' ' > "$d/names"
          case "$(cat "$d/names")" in
            "bzImage container-initrd "|"Image container-initrd ") ;;
            *) echo "SHA256SUMS lists $(cat "$d/names")rather than the kernel and the initrd"; exit 1 ;;
          esac
          grep -Eq '^KERNEL_SOURCE=.+@sha256:[0-9a-f]{64}$' dist/*.pins.env \
            || { echo "pins.env does not name the kernel by digest"; exit 1; }
          src="$(sed -n 's/^KERNEL_SOURCE=//p' dist/*.pins.env)"
          grep -qx "INITRD_SOURCE=$src" dist/*.pins.env \
            || { echo "pins.env does not name the initrd as $src"; exit 1; }
          # Each layer of the signed manifest is one file, named by its title,
          # and its digest is the file's sha256.
          o="$(echo "$d"/*/bin/oras)"
          "$o" manifest fetch "${src%%:*}@${src##*@}" > "$d/manifest.json"
          while read -r sum name; do
            want="$(jq -r --arg n "$name" \
              '.layers[] | select(.annotations["org.opencontainers.image.title"] == $n) | .digest' \
              "$d/manifest.json")"
            [ "$want" = "sha256:$sum" ] \
              || { echo "$name is sha256:$sum, but $src has '$want'"; exit 1; }
            echo "$name: $want, as in $src"
          done < "$g/SHA256SUMS"
          cat "$g/bundle.json"
          jq -e --arg s "$src" '.built_by == "hull-assets" and .kernel.source == $s and .initrd.source == $s' \
            "$g/bundle.json" > /dev/null \
            || { echo "bundle.json does not name $src as the source of both files"; exit 1; }

      # install.sh retargets a user install by rewriting the layout the bundle
      # was generated with, which it reads from here.
      - name: Check the bundle records its layout
        run: |
          set -eu
          p="$(ls dist/*.pins.env)"
          for k in PREFIX DATA_DIR RUN_DIR; do
            grep -q "^$k=/" "$p" || { echo "pins.env does not record $k"; exit 1; }
          done
          # install.sh reads this back to refuse a user install on a bundle
          # that cannot serve one.
          case "${{ matrix.rootless }}" in
            rootless) want=true ;;
            *)        want=false ;;
          esac
          grep -q "^ROOTLESS=$want$" "$p" \
            || { echo "pins.env does not say ROOTLESS=$want"; exit 1; }
          # urunc is built from a pinned commit, and the build fails if the
          # checkout is anything else. This checks the record: the commit in
          # pins.env is the one the script pins, and the guest assets were
          # built from it.
          want="$(sed -n 's/^URUNC_REF_DEFAULT=\([0-9a-f]\{40\}\)$/\1/p' scripts/build-bundle.sh)"
          [ -n "$want" ] || { echo "no URUNC_REF_DEFAULT in build-bundle.sh"; exit 1; }
          grep -E "^URUNC_(REF|PINNED)=" "$p"
          grep -qx "URUNC_REF=$want" "$p" || { echo "pins.env does not carry URUNC_REF=$want"; exit 1; }
          grep -qx "URUNC_PINNED=true" "$p" || { echo "pins.env does not say URUNC_PINNED=true"; exit 1; }
          grep -qx "ASSETS_URUNC_REF=$want" "$p" \
            || { echo "pins.env does not carry ASSETS_URUNC_REF=$want"; exit 1; }
          # hvi is fetched from the release the script pins; fetch-hvi.sh
          # fails the build unless its signature and sums check out.
          grep -E "^HVI_(VERSION|COMMIT)=" "$p"
          for k in HVI_VERSION HVI_COMMIT; do
            want="$(sed -n "s/^$k=\([0-9a-z.-]*\)$/\1/p" scripts/build-bundle.sh)"
            [ -n "$want" ] || { echo "no $k in build-bundle.sh"; exit 1; }
            grep -qx "$k=$want" "$p" || { echo "pins.env does not carry $k=$want"; exit 1; }
          done
          # urunit is not built here. pins.env records the commit the pinned
          # urunc pins in packaging/container-initrd/urunit.pin. Read that file
          # at the recorded urunc commit and compare.
          urunc_repo="$(sed -n 's/^URUNC_REPO=//p' "$p")"
          urunc_ref="$(sed -n 's/^URUNC_REF=//p' "$p")"
          want="$(curl -fsSL "https://raw.githubusercontent.com/$urunc_repo/$urunc_ref/packaging/container-initrd/urunit.pin" \
            | sed -n 's/^URUNIT_REF=\([0-9a-f]\{40\}\)$/\1/p')"
          [ -n "$want" ] || { echo "$urunc_repo@$urunc_ref has no urunit.pin naming a commit"; exit 1; }
          grep -E "^URUNIT_(REPO|REF)=" "$p"
          grep -qx "URUNIT_REF=$want" "$p" || { echo "pins.env does not carry URUNIT_REF=$want, urunc's pin"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.arch }}-${{ matrix.rootless }}
          path: dist/*
