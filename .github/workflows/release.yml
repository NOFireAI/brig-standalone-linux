# Build, sign and publish the self-contained brig bundles.
#
# Each architecture is built on a native runner -- amd64 on ubuntu-24.04, arm64
# on ubuntu-24.04-arm -- so the urunc/urunit/initrd builds run native rather than
# under qemu. A final job collects both, checksums and signs them, and publishes
# one release.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            rootless: plain
            flag: ''
          - arch: amd64
            runner: ubuntu-24.04
            rootless: rootless
            flag: '--rootless'
          - arch: arm64
            runner: ubuntu-24.04-arm
            rootless: plain
            flag: ''
          - arch: arm64
            runner: ubuntu-24.04-arm
            rootless: rootless
            flag: '--rootless'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the ${{ matrix.arch }} ${{ matrix.rootless }} bundle
        env:
          # Pin every timestamp in the archives. The fetched components are
          # byte-identical per pin; the source-built urunc, urunit and initrd
          # are not guaranteed bit-for-bit across builds.
          SOURCE_DATE_EPOCH: '0'
        run: |
          set -eu
          scripts/build-bundle.sh --arch "${{ matrix.arch }}" \
            --version "${{ needs.version.outputs.version }}" \
            --variant generic-boot ${{ matrix.flag }} --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.arch }}-${{ matrix.rootless }}
          path: dist/*

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Keyless cosign and the provenance attestation both take a short-lived
      # certificate from Sigstore against this workflow's OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3

      - name: Collect the per-arch bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: incoming
          merge-multiple: true

      - name: Assemble dist
        run: |
          set -eu
          mkdir -p dist
          cp incoming/* dist/
          cp install.sh dist/install.sh
          ls -la dist

      # checksums.txt covers every asset, so the one signature below vouches
      # for all of them.
      - name: Checksum every asset
        working-directory: dist
        run: sha256sum -- * > checksums.txt && cat checksums.txt

      - name: Sign the checksums
        working-directory: dist
        run: |
          cosign sign-blob checksums.txt \
            --output-certificate checksums.txt.pem \
            --output-signature checksums.txt.sig \
            --yes

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/brig-standalone-*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.version }}" \
            --title "${{ needs.version.outputs.version }}" \
            --generate-notes \
            --draft \
            dist/*
